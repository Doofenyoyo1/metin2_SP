{% extends 'base.html' %}{% block title %}Pierwsza konfiguracja · MT2009 PLUS{% endblock %}{% block content %}
<section class="setup-card panel"><p class="eyebrow">PIERWSZE URUCHOMIENIE</p><h1>Skonfiguruj panel</h1><p class="muted">Te ustawienia można później zmienić w Zarządzaniu.</p><form method="post" class="manage-form settings-form"><label>Nazwa panelu <input name="panel_name" maxlength="48" value="MT2009 PLUS" required></label><label>Alarm bez ruchu <input name="stuck_minutes" type="number" min="1" max="120" value="5" required><small>minut</small></label><label>Kolorystyka <select name="theme"><option value="ocean">Ocean</option><option value="ember">Ember</option><option value="forest">Forest</option><option value="empire">Cesarstwo</option></select></label><label>Źródło monitoringu <select name="monitor_mode"><option value="vps">VPS / host</option><option value="docker">Docker / lokalnie</option></select></label><label class="checkbox-row"><span>Ochrona hasłem</span><input id="enable-auth" type="checkbox" name="auth_enabled" value="1"><small>opcjonalnie</small></label><label id="setup-password" hidden>Hasło panelu <input name="panel_password" type="password" minlength="8" autocomplete="new-password" placeholder="co najmniej 8 znaków"><small>opcjonalne</small></label><button>Zapisz i otwórz panel</button></form></section><script>const check=document.getElementById('enable-auth'),password=document.getElementById('setup-password');check.addEventListener('change',()=>password.hidden=!check.checked);</script>{% endblock %}
