name: Publish mt2009 release

# Builds the mt2009 update packages on Linux (tools/build_mt2009_*_update.py),
# publishes them as a GitHub release, and writes their SHA-256 into
# update-manifest-mt2009.json on the branch it ran from. The launcher reads that
# manifest from main, so the branch is merged into main after the release
# exists, never before.
#
# What it builds is what the version files say changed against the manifest:
# the server when linux-port-mt2009/VERSION differs from the manifest's server
# version, the client when CLIENT_VERSION differs from its client version. The
# previous packages are the ones the manifest points at, and the previous
# client's source commit is the tag of the release it was published in. A
# server release is tagged v<server>; a client-only one client-v<client>.
#
# Run it from the Actions tab (Run workflow) on the branch to release; the
# push trigger fires when this file itself changes on a claude/ branch. A
# release that already has its packages stops the run before anything is built.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/publish-mt2009-release.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: What to release
        id: v
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open('update-manifest-mt2009.json', encoding='utf-8-sig'))
          server = open('linux-port-mt2009/VERSION').read().strip()
          client = open('linux-port-mt2009/CLIENT_VERSION').read().strip()
          build_server = server != m['server']['version']
          build_client = client != m['client']['version']
          print('server=%s' % server)
          print('client=%s' % client)
          print('build_server=%s' % str(build_server).lower())
          print('build_client=%s' % str(build_client).lower())
          print('tag=%s' % ('v' + server if build_server else 'client-v' + client))
          print('prev_server_url=%s' % m['server']['url'])
          print('prev_server_sha=%s' % m['server']['sha256'])
          print('prev_client_url=%s' % m['client']['url'])
          print('prev_client_sha=%s' % m['client']['sha256'])
          # .../releases/download/<tag>/<file>: the release the previous client came in.
          print('prev_client_tag=%s' % m['client']['url'].split('/releases/download/')[1].split('/')[0])
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Refuse an empty or a published release
        env:
          TAG: ${{ steps.v.outputs.tag }}
          BUILD_SERVER: ${{ steps.v.outputs.build_server }}
          BUILD_CLIENT: ${{ steps.v.outputs.build_client }}
        run: |
          set -euo pipefail
          if [ "$BUILD_SERVER" != true ] && [ "$BUILD_CLIENT" != true ]; then
            echo "::error::VERSION and CLIENT_VERSION both match the manifest - bump one of them first."
            exit 1
          fi
          # A release with its packages is published and never touched again. One
          # with none attached is what an interrupted run leaves, and is replaced.
          if assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null); then
            if [ "$assets" -gt 0 ]; then
              echo "::error::$TAG is already published with $assets file(s) - bump the version first."
              exit 1
            fi
            echo "$TAG exists with no files attached: replacing it."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG exists without a release - remove it or bump the version."
            exit 1
          fi

      - name: Tools
        if: steps.v.outputs.build_client == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzo2-dev
          python3 -m pip install --quiet python-lzo

      - name: Previous packages
        env:
          SERVER_URL: ${{ steps.v.outputs.prev_server_url }}
          SERVER_SHA: ${{ steps.v.outputs.prev_server_sha }}
          CLIENT_URL: ${{ steps.v.outputs.prev_client_url }}
          CLIENT_SHA: ${{ steps.v.outputs.prev_client_sha }}
          BUILD_SERVER: ${{ steps.v.outputs.build_server }}
          BUILD_CLIENT: ${{ steps.v.outputs.build_client }}
        run: |
          set -euo pipefail
          mkdir -p prev
          if [ "$BUILD_SERVER" = true ]; then
            curl -fsSL --retry 4 -o prev/server.zip "$SERVER_URL"
            echo "$SERVER_SHA  prev/server.zip" | tr 'A-F' 'a-f' | sha256sum -c -
          fi
          if [ "$BUILD_CLIENT" = true ]; then
            curl -fsSL --retry 4 -o prev/client.zip "$CLIENT_URL"
            echo "$CLIENT_SHA  prev/client.zip" | tr 'A-F' 'a-f' | sha256sum -c -
          fi

      - name: Build
        env:
          BUILD_SERVER: ${{ steps.v.outputs.build_server }}
          BUILD_CLIENT: ${{ steps.v.outputs.build_client }}
          PREV_CLIENT_TAG: ${{ steps.v.outputs.prev_client_tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$BUILD_SERVER" = true ]; then
            python3 tools/build_mt2009_server_update.py --previous prev/server.zip --out out
          fi
          if [ "$BUILD_CLIENT" = true ]; then
            since=$(git rev-parse "$PREV_CLIENT_TAG^{commit}")
            echo "previous client from $PREV_CLIENT_TAG = $since"
            python3 tools/build_mt2009_client_update.py --previous prev/client.zip --since "$since" --out out
          fi
          ls -la out

      - name: Manifest
        env:
          SERVER: ${{ steps.v.outputs.server }}
          CLIENT: ${{ steps.v.outputs.client }}
          TAG: ${{ steps.v.outputs.tag }}
          BUILD_SERVER: ${{ steps.v.outputs.build_server }}
          BUILD_CLIENT: ${{ steps.v.outputs.build_client }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import datetime, hashlib, json, os
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['TAG']
          base = 'https://github.com/%s/releases/download/%s/' % (repo, tag)
          def sha(p):
              return hashlib.sha256(open(p, 'rb').read()).hexdigest().upper()
          path = 'update-manifest-mt2009.json'
          raw = open(path, 'rb').read()
          m = json.loads(raw)
          m['publishedAt'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          for kind, flag, version in (('server', 'BUILD_SERVER', os.environ['SERVER']),
                                      ('client', 'BUILD_CLIENT', os.environ['CLIENT'])):
              if os.environ[flag] != 'true':
                  continue
              name = 'metin2-%s-update-%s.zip' % (kind, version)
              m[kind].update(version=version, url=base + name, sha256=sha('out/' + name))
          out = json.dumps(m, indent=2, ensure_ascii=False) + '\n'
          if b'\r\n' in raw:
              out = out.replace('\n', '\r\n')
          open(path, 'w', encoding='utf-8', newline='').write(out)
          EOF
          python3 tools/check-manifest-points-at-release.py "$SERVER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-manifest-mt2009.json
          git commit -m "chore(release): manifest hashes for $TAG"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Release
        env:
          SERVER: ${{ steps.v.outputs.server }}
          CLIENT: ${{ steps.v.outputs.client }}
          TAG: ${{ steps.v.outputs.tag }}
          BUILD_SERVER: ${{ steps.v.outputs.build_server }}
        run: |
          set -euo pipefail
          # A server release's notes are its CHANGELOG section; a client-only
          # one's are its "### Klient <version>" subsection.
          if [ "$BUILD_SERVER" = true ]; then
            head="## $SERVER "; title="$SERVER (klient $CLIENT)"
          else
            head="### Klient $CLIENT"; title="Klient $CLIENT"
          fi
          awk -v h="$head" '
            index($0, h) == 1 { on = 1; print; next }
            on && (/^## / || (h ~ /^###/ && /^### /)) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          files=$(ls out/*.zip)
          # Created as a draft, the files uploaded on their own, and published only
          # once every one is there with its size: a one-call create once
          # published a release with no files and reported success.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title "$title" --notes-file notes.md --draft
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          for f in $files; do
            name=$(basename "$f"); want=$(stat -c %s "$f")
            got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                  --jq ".assets[] | select(.name == \"$name\") | .size")
            echo "$name: local $want, release ${got:-missing}"
            [ "$got" = "$want" ] || { echo "::error::$name did not reach the release"; exit 1; }
          done
          if [ "$BUILD_SERVER" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
